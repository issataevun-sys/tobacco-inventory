<script>
window.crStaffTobaccoFactory=function(api){
 'use strict';
 var root=null,model=null,draft=null,zone='service',brand='',packs=[],busy=false,epoch=0,opened=false,scanReader=null,scanOpen=false,serviceFilter='remaining',scanMode='inventory',barcodeOverlay=null;
 function esc(s){return String(s===null||s===undefined?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
 function date(s){return /^\d{4}-\d{2}-\d{2}$/.test(s)?new Date(s+'T12:00:00Z').toLocaleDateString('ru-RU',{timeZone:'UTC',year:'numeric',month:'long',day:'numeric'}):String(s)}
 var brandNames={BB:'BlackBurn',CH:'Chabacco',DEUS:'DEUS',DS:'Darkside',MH:'Musthave',OD:'Overdose',S:'Sebero',TN:'Tangiers'};
 function brandLabel(code){return brandNames[code]||code}
 function label(i){return (i.brand?brandLabel(i.brand)+' · ':'')+i.name}
 function q(s){return root&&root.querySelector(s)}
 function filled(i){var v=draft&&draft.get(i.itemId);return !!v&&(i.category==='tobacco'?v.serviceGross!==''&&v.serviceGross!==null&&v.serviceGross!==undefined:v.serviceQty!==''&&v.serviceQty!==null&&v.serviceQty!==undefined)}
 function shouldShow(i){return serviceFilter==='all'||(serviceFilter==='filled'?filled(i):!filled(i))}
 function message(text){var el=q('.tbError');if(el)el.textContent=text}
 function capture(){
  if(!draft||!root)return;
  root.querySelectorAll('[data-gross]').forEach(function(el){draft.get(el.dataset.gross).serviceGross=el.value});
  root.querySelectorAll('[data-service-qty]').forEach(function(el){draft.get(el.dataset.serviceQty).serviceQty=el.value});
  root.querySelectorAll('[data-warehouse-qty]').forEach(function(el){draft.get(el.dataset.warehouseQty).warehouseQty=el.value});
  if(zone==='warehouse')packs=Array.from(root.querySelectorAll('[data-pack-line]')).map(function(row){
   return {itemId:row.querySelector('[data-item]').value,pack:row.querySelector('[data-size]').value,pieces:row.querySelector('[data-pieces]').value};
  });
 }

 function addNumericClearButtons(container){
  if(!container)return;
  container.querySelectorAll('input[data-gross],input[data-service-qty],input[data-warehouse-qty],input[data-pieces]').forEach(function(input){
   if(input.closest('.tbNumberField'))return;
   var wrapper=document.createElement('span');
   wrapper.className='tbNumberField';
   input.parentNode.insertBefore(wrapper,input);
   wrapper.appendChild(input);
   var clear=document.createElement('button');
   clear.type='button';clear.className='tbNumberClear';
   clear.setAttribute('aria-label','Очистить значение');
   clear.setAttribute('title','Очистить значение');
   clear.innerHTML='<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
   wrapper.appendChild(clear);
   function update(){clear.hidden=input.value===''}
   input.addEventListener('input',function(){
    var limit=Number(input.dataset.digits||3);
    var normalized=String(input.value||'').replace(/[^0-9]/g,'').slice(0,limit);
    if(input.value!==normalized)input.value=normalized;
    update();
   });
   input.addEventListener('change',update);
   clear.addEventListener('click',function(e){
    e.preventDefault();e.stopPropagation();
    input.value='';
    input.dispatchEvent(new Event('input',{bubbles:true}));
    input.dispatchEvent(new Event('change',{bubbles:true}));
    input.focus();
   });
   update();
  });
 }


 function scannedGtin(raw){
  var s=String(raw==null?'':raw).replace(/^\]d[12]/,'').replace(/^\]Q3/,'').trim(),values=[];
  function add(v){if(/^\d{14}$/.test(v)&&values.indexOf(v)<0)values.push(v)}
  // Same validated parser as tobacco-inventory v1.0.2: Kazakhstan 14+7+8.
  if(/^\d{14}[\s\S]{15}$/.test(s))add(s.slice(0,14));
  Array.from(s.matchAll(/(?:\(01\)|(?:^|\x1d)01)\s*(\d{14})/g)).forEach(function(m){add(m[1])});
  if(/^01\d{14}/.test(s))add(s.slice(2,16));
  if(/^\d{13}$/.test(s))add('0'+s);
  if(/^\d{14}$/.test(s))add(s);

 function loadScanDecoder(){
  if(window.Html5Qrcode)return Promise.resolve();
  var urls=['https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js','https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js'];
  function load(i){
   if(i>=urls.length)return Promise.reject(Error('Декодер не загрузился'));
   return new Promise(function(ok,fail){var s=document.createElement('script');s.src=urls[i];s.onload=ok;s.onerror=fail;document.head.appendChild(s)})
    .then(function(){if(!window.Html5Qrcode)throw Error('Декодер недоступен')}).catch(function(){return load(i+1)});
  }
  return load(0);
 }

   await loadScanDecoder();
   if(!scanOpen||seq+1!==scanSeq)return;
   var supported=[Html5QrcodeSupportedFormats.DATA_MATRIX,Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.UPC_A];
   decoder=new Html5Qrcode('tb-inline-reader',{formatsToSupport:supported,verbose:false,experimentalFeatures:{useBarCodeDetectorIfSupported:false}});
   scanReader=decoder;

   await decoder.start({facingMode:'environment'},{
    fps:15,qrbox:{width:side,height:side},aspectRatio:1,
    videoConstraints:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}}
   },function(decoded){if(scanOpen&&scanReader===decoder)scanFound(decoded)},function(){});
   if(!scanOpen||scanReader!==decoder){try{await decoder.stop()}catch(e){};try{decoder.clear()}catch(e){};return}

   scanStatus('Наведите камеру на Data Matrix или штрихкод');
  }catch(e){
   scanStatus('Не удалось открыть камеру: '+String(e&&e.message||e)+'. Можно ввести GTIN вручную.');

   '<div class="tbDateChoices" role="group" aria-label="Дата инвентаризации">'+
   '<button type="button" class="tbBtn" data-day="-1">'+esc(shortDay(shifted(-1)))+'</button>'+
   '<button type="button" class="tbBtn active" data-day="0">'+esc(shortDay(base))+'</button>'+
   '<button type="button" class="tbBtn" data-day="1">'+esc(shortDay(shifted(1)))+'</button></div>'+
   '<p class="tbSelectedDate">Дата: <strong data-date>'+esc(date(day))+'</strong></p>'+
   '<p>Позиции сформируются из предыдущей завершённой инвентаризации и приходов.</p>'+
   '<p class="tbError" role="status" aria-live="polite"></p>'+
   '<div class="tbDialogActions"><button type="button" class="tbBtn" data-cancel>Отмена</button>'+
   '<button type="button" class="tbBtn tbConfirm" data-confirm>Создать</button></div></div>';
  root.appendChild(overlay);
  var cancel=overlay.querySelector('[data-cancel]'),ok=overlay.querySelector('[data-confirm]');
  overlay.querySelectorAll('[data-day]').forEach(function(button){
   button.onclick=function(){
    if(busy)return;
    day=shifted(Number(button.dataset.day));
    overlay.querySelector('[data-date]').textContent=date(day);
    overlay.querySelectorAll('[data-day]').forEach(function(b){b.classList.toggle('active',b===button)});
    var error=overlay.querySelector('.tbError');if(error)error.textContent='';
   };
  });
  function close(){if(busy)return;overlay.remove()}
  cancel.onclick=close;overlay.onclick=function(e){if(e.target===overlay)close()};
  overlay.onkeydown=function(e){if(e.key==='Escape')close()};
  ok.focus();
  ok.onclick=function(){
   if(busy)return;
   busy=true;ok.disabled=true;cancel.disabled=true;ok.textContent='Создаём…';
   api.call('crStaffTobaccoCreate',{day:day},function(){
    busy=false;overlay.remove();refresh();
   },function(err){
    busy=false;ok.disabled=false;cancel.disabled=false;ok.textContent='Создать';
    var error=overlay.querySelector('.tbError');if(error)error.textContent=String(err||'Не удалось создать инвентаризацию');
   });
  };
 }
 function buildLinesForSave(){
  var grouped=new Map();
  packs.forEach(function(p){var list=grouped.get(p.itemId)||[];list.push({pack:Number(p.pack),pieces:Number(p.pieces)});grouped.set(p.itemId,list)});
  return model.lines.map(function(i){var v=draft.get(i.itemId);
   if(i.category==='tobacco'){
    var gross=v.serviceGross===''||v.serviceGross===null?null:Number(v.serviceGross);
    return {itemId:i.itemId,serviceGross:gross,serviceTare:gross===0?0:(v.serviceTare===''?null:Number(v.serviceTare)),warehousePacks:grouped.get(i.itemId)||[]};
   }
   return {itemId:i.itemId,serviceQty:v.serviceQty===''?null:Number(v.serviceQty),warehouseQty:v.warehouseQty===''?null:Number(v.warehouseQty)};
  });
 }
 function fillMissingZeros(){
  if(busy||!model||!model.active)return;
  capture();
  if(packs.some(function(p){return !p.itemId||![100,125,200,250].includes(Number(p.pack))||!Number.isInteger(Number(p.pieces))||Number(p.pieces)<1||Number(p.pieces)>9})){
   message('Сначала заполните или удалите незавершённые позиции закрытых пачек');return;
  }
  var missing=0;
  model.lines.forEach(function(i){
   var v=draft.get(i.itemId);if(!v)return;
   if(i.category==='tobacco'){if(v.serviceGross===''||v.serviceGross===null||v.serviceGross===undefined)missing++}
   else{
    if(v.serviceQty===''||v.serviceQty===null||v.serviceQty===undefined)missing++;
    if(v.warehouseQty===''||v.warehouseQty===null||v.warehouseQty===undefined)missing++;
   }
  });
  if(!missing){message('Все поля уже заполнены');return}
  var overlay=document.createElement('div');
  overlay.className='tbDialogBackdrop';
  overlay.innerHTML='<div class="tbDialog" role="dialog" aria-modal="true" aria-labelledby="tbZeroTitle">'+
   '<h4 id="tbZeroTitle">Заполнить пустые нулями?</h4>'+
   '<p>Незаполненных полей: <strong>'+missing+'</strong>.</p>'+
   '<p>Они будут заполнены нулями и сохранены для Сервиса и Склада. Уже введённые значения останутся без изменений.</p>'+
   '<div class="tbDialogActions"><button type="button" class="tbBtn" data-zero-cancel>Отмена</button>'+
   '<button type="button" class="tbBtn tbConfirm" data-zero-confirm>Заполнить</button></div></div>';
  root.appendChild(overlay);
  var cancel=overlay.querySelector('[data-zero-cancel]');
  cancel.onclick=function(){overlay.remove()};
  overlay.addEventListener('click',function(e){if(e.target===overlay)overlay.remove()});
  overlay.querySelector('[data-zero-confirm]').onclick=function(){
   overlay.remove();
   applyMissingZeros();
  };
 }
 function applyMissingZeros(){
  if(busy||!model||!model.active)return;
  model.lines.forEach(function(i){
   var v=draft.get(i.itemId);if(!v)return;
   if(i.category==='tobacco'){
    if(v.serviceGross===''||v.serviceGross===null||v.serviceGross===undefined)v.serviceGross='0';
    if(Number(v.serviceGross)===0)v.serviceTare='0';
   }else{
    if(v.serviceQty===''||v.serviceQty===null||v.serviceQty===undefined)v.serviceQty='0';
    if(v.warehouseQty===''||v.warehouseQty===null||v.warehouseQty===undefined)v.warehouseQty='0';
   }
  });
  var lines=buildLinesForSave(),rev=model.revision;
  busy=true;
  var saveBtn=q('[data-save]'),zeroBtn=q('[data-fill-zeros]');
  if(saveBtn)saveBtn.disabled=true;if(zeroBtn)zeroBtn.disabled=true;
  message('');
  api.call('crStaffTobaccoSave',{id:model.id,zone:'service',revision:rev,lines:lines},function(){
   api.call('crStaffTobaccoSave',{id:model.id,zone:'warehouse',revision:rev,lines:lines},function(){
    busy=false;refresh();
   },function(err){busy=false;message('Сервис сохранён, но Склад не сохранён: '+err);var b=q('[data-save]'),z=q('[data-fill-zeros]');if(b)b.disabled=false;if(z)z.disabled=false});
  },function(err){busy=false;message(err);var b=q('[data-save]'),z=q('[data-fill-zeros]');if(b)b.disabled=false;if(z)z.disabled=false});
 }
 function save(){
  if(busy||!model||!model.active)return;
  capture();
  if(zone==='warehouse'&&packs.some(function(p){return !p.itemId||![100,125,200,250].includes(Number(p.pack))||!Number.isInteger(Number(p.pieces))||Number(p.pieces)<1})){
   message('Для каждой закрытой пачки укажите вкус, фасовку и количество');return;
  }
  var invalid=root.querySelector('[data-content] input[data-digits]')&&Array.from(root.querySelectorAll('[data-content] input[data-digits]')).find(function(el){
   var v=String(el.value||'');
   if(!v)return false;
   var max=Number(el.dataset.digits||3);
   var regex=/^[0-9]+$/;
   var whole=v.split('.')[0];
   return !regex.test(v)||whole.length>max||(el.hasAttribute('data-pieces')&&Number(v)<1);
  });
  if(invalid){message('Проверьте количество цифр в поле');invalid.focus();return}
  var lines=buildLinesForSave();
  busy=true;q('[data-save]').disabled=true;message('');
  var rev=model.revision;
  api.call('crStaffTobaccoSave',{id:model.id,zone:zone,revision:rev,lines:lines},function(r){
   busy=false;refresh();
  },function(err){busy=false;var b=q('[data-save]');if(b)b.disabled=false;message(err)});
 }
 function refresh(){
  if(!root||busy)return;
  var current=++epoch;
  root.innerHTML='<p class="tbHint">Загружаем инвентаризацию…</p>';
  api.call('crStaffTobaccoActive',{},function(r){
   if(current!==epoch||!api.isActive())return;
   model=r;draft=new Map();packs=[];
   (r.lines||[]).forEach(function(i){
    draft.set(i.itemId,{serviceGross:i.serviceGross??'',serviceTare:i.serviceTare??'',serviceQty:i.serviceQty??'',warehouseQty:i.warehouseQty??''});
    (i.warehousePacks||[]).forEach(function(p){packs.push({itemId:i.itemId,pack:p.pack,pieces:p.pieces})});
   });
   render();
  },function(err){if(current===epoch&&root)root.innerHTML='<p class="tbError">'+esc(err)+'</p><button class="tbBtn" data-refresh>Повторить</button>';if(q('[data-refresh]'))q('[data-refresh]').onclick=refresh});
 }
 return {mount:function(node){root=node;opened=false;refresh()},refresh:refresh,clear:function(){if(barcodeOverlay){barcodeOverlay.remove();barcodeOverlay=null}stopScan();scanOpen=false;epoch++;root=null;model=null;draft=null;packs=[];opened=false}};
};
</script>
