/* STAFF-matched standalone PIN screen, isolated from the inventory workspace. */
body.inventoryLogin{background:#14171c;color:#f4f5f7;min-height:100dvh;}
body.inventoryLogin main{max-width:440px}
body.inventoryLogin .appHeader{background:#14171c}

#pinScreen{background:#20252b;color:#f4f5f7;border-radius:23px;padding:30px 22px;margin:26px auto;max-width:400px;box-shadow:0 20px 70px #0003}
#pinScreen h2{font-size:25px;font-weight:700;text-align:center;margin:0 0 24px;color:#f4f5f7;letter-spacing:-.6px}
#pinScreen .pinEntry{max-width:348px}
#pinScreen #pinForm button[type=submit]{display:block;width:100%;min-height:52px;margin-top:22px;background:#eff1f4;color:#151a1f;border:0;border-radius:13px;font-size:16px;font-weight:650}
#pinScreen #pinError{color:#ff999e;min-height:18px;font-size:12px;text-align:center;margin-top:12px}
/* Six-slot PIN, single actual secure field: iOS/Android numeric keyboard. */
#pinScreen .pinEntry{max-width:348px;width:100%;margin:0 auto;position:relative}
#pinScreen .pinLabel{display:block;text-align:center;font-size:13px;font-weight:500;color:#bec5cc;margin:0 0 16px}
#pinScreen .pinCells{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px;width:100%;pointer-events:none}
#pinScreen .pinCell{height:56px;display:flex;align-items:center;justify-content:center;border:1px solid #4b535d;
border-radius:12px;background:#30363e;color:#f5f6f8;font-size:32px;font-weight:900;
line-height:1;transition:border-color .1s ease,background-color .1s ease}
#pinScreen .pinCell.filled{background:#373f49;color:#f7f9fc}
#pinScreen .pinEntry:focus-within .pinCell.current{border-color:#81a9f7;box-shadow:inset 0 0 0 1px #81a9f7}
#pinScreen .pinEntry .pinCapture{position:absolute;top:23px;left:0;width:100%;height:calc(100% - 23px);
border:0!important;background:transparent!important;color:transparent!important;
-webkit-text-fill-color:transparent!important;caret-color:transparent!important;
opacity:.025;padding:0!important;margin:0!important;outline:none!important;
font-size:18px!important;letter-spacing:0!important;border-radius:0!important;
-webkit-appearance:none;appearance:none;z-index:2}
#pinScreen .pinEntry .pinCapture::selection{background:transparent}
#pinScreen .pinHint{text-align:center;margin:12px 0 0!important;color:#99a3ad;font-size:12px}
#pinForm{display:block}
#pinForm button[type=submit]{margin-top:22px}
@media(max-width:700px){#pinScreen .pinEntry{max-width:344px}#pinScreen .pinCells{gap:8px}
#pinScreen .pinCell{height:54px;border-radius:12px;font-size:32px}
#pinScreen .pinEntry .pinCapture{font-size:18px!important}}
@media(max-width:370px){#pinScreen .pinCells{gap:6px}#pinScreen .pinCell{height:49px;border-radius:10px}}
/* Draw geometric circles, not baseline-aligned text glyphs. */
#pinScreen .pinCell{font-size:0!important;line-height:0!important}
#pinScreen .pinCell::after{content:"";display:block;width:12px;height:12px;border-radius:50%;background:transparent;flex:none}
#pinScreen .pinCell.filled::after{background:#f2c744}

/* PIN transition: yellow active border; red single shake; green cells merge on success. */
#pinScreen .pinCells{position:relative;isolation:isolate}
#pinScreen .pinCell{position:relative;will-change:transform;transition:border-color .15s,box-shadow .15s,background-color .15s,transform .38s cubic-bezier(.2,.82,.25,1),opacity .25s}
#pinScreen .pinEntry:focus-within:not(.is-verifying):not(.is-error):not(.is-success) .pinCell.current{border-color:#f2c744!important;box-shadow:0 0 0 2px rgba(242,199,68,.23),inset 0 0 0 1px #f2c744!important}
#pinScreen .pinEntry.is-verifying .pinCell.current{border-color:#f2c744}

/* Clockwise golden stroke runs along each PIN cell border only while login RPC is pending.
   Registered angle provides smooth rotation on current Safari/iPadOS and Chrome. */
@property --pin-border-angle{syntax:"<angle>";inherits:false;initial-value:0deg}
#pinScreen .pinEntry.is-verifying .pinCell{border-color:#555058}
#pinScreen .pinEntry.is-verifying .pinCell::before{
 content:"";position:absolute;inset:-2px;border-radius:inherit;padding:2px;
 background:conic-gradient(from var(--pin-border-angle),transparent 0deg,transparent 265deg,#f2c744 315deg,#ffe796 336deg,transparent 360deg);
 -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
 -webkit-mask-composite:xor;
 mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
 mask-composite:exclude;
 animation:pinBorderClockwise 1.1s linear infinite;
 pointer-events:none;z-index:1;
}
#pinScreen .pinEntry.is-verifying .pinCell:nth-child(2)::before{animation-delay:-.16s}
#pinScreen .pinEntry.is-verifying .pinCell:nth-child(3)::before{animation-delay:-.32s}
#pinScreen .pinEntry.is-verifying .pinCell:nth-child(4)::before{animation-delay:-.48s}
#pinScreen .pinEntry.is-verifying .pinCell:nth-child(5)::before{animation-delay:-.64s}
#pinScreen .pinEntry.is-verifying .pinCell:nth-child(6)::before{animation-delay:-.8s}
@keyframes pinBorderClockwise{to{--pin-border-angle:360deg}}
@media(prefers-reduced-motion:reduce){
 #pinScreen .pinEntry.is-verifying .pinCell::before{animation:none;background:#f2c744}
}

#pinScreen .pinEntry.is-error .pinCells{animation:pinShakeOnce .36s ease-in-out both}
#pinScreen .pinEntry.is-error .pinCell{background:#7f2934!important;border-color:#f45d68!important;box-shadow:0 0 0 1px rgba(244,93,104,.22)!important}
#pinScreen .pinEntry.is-error .pinCell::after{background:#fff!important}
@keyframes pinShakeOnce{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
#pinScreen .pinEntry.is-success .pinCell{background:#238957!important;border-color:#37b978!important;box-shadow:none!important;transform:translateX(var(--pin-merge-x,0px)) scale(.88);opacity:0}
#pinScreen .pinEntry.is-success .pinCell::after{opacity:0}
#pinScreen .pinEntry.is-success .pinCell:nth-child(3){opacity:1}
#pinScreen .pinSuccessBadge{position:absolute;z-index:3;left:50%;top:50%;width:52px;height:52px;border-radius:12px;background:#238957;border:1px solid #37b978;color:#fff;display:flex;align-items:center;justify-content:center;opacity:0;transform:translate(-50%,-50%) scale(.75);transition:opacity .2s ease .3s,transform .25s ease .3s;pointer-events:none}
#pinScreen .pinSuccessBadge svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
#pinScreen .pinEntry.is-success .pinSuccessBadge{opacity:1;transform:translate(-50%,-50%) scale(1)}
@media(prefers-reduced-motion:reduce){#pinScreen .pinEntry.is-error .pinCells{animation:none}#pinScreen .pinCell,#pinScreen .pinSuccessBadge{transition-duration:.01ms!important;transition-delay:0ms!important}}

<script>
window.crStaffTobaccoFactory=function(api){
 'use strict';
 var root=null,model=null,draft=null,zone='service',brand='',packs=[],busy=false,epoch=0,opened=false,scanReader=null,scanOpen=false;
 function esc(s){return String(s===null||s===undefined?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
 function date(s){return /^\d{4}-\d{2}-\d{2}$/.test(s)?new Date(s+'T12:00:00Z').toLocaleDateString('ru-RU',{timeZone:'UTC',year:'numeric',month:'long',day:'numeric'}):String(s)}
 var brandNames={BB:'BlackBurn',CH:'Chabacco',DEUS:'DEUS',DS:'Darkside',MH:'Musthave',OD:'Overdose',S:'Sebero',TN:'Tangiers'};
 function brandLabel(code){return brandNames[code]||code}
 function label(i){return (i.brand?brandLabel(i.brand)+' · ':'')+i.name}
 function q(s){
  var inside=root&&root.querySelector(s);
  return inside||((s.startsWith('[data-scan-')||s.startsWith('#tb-inline-reader'))?document.querySelector(s):null);
 }
 function message(text){var el=q('.tbError');if(el)el.textContent=text}
 function capture(){
  if(!draft||!root)return;
  root.querySelectorAll('[data-gross]').forEach(function(el){draft.get(el.dataset.gross).serviceGross=el.value});
  root.querySelectorAll('[data-service-qty]').forEach(function(el){draft.get(el.dataset.serviceQty).serviceQty=el.value});
  root.querySelectorAll('[data-warehouse-qty]').forEach(function(el){draft.get(el.dataset.warehouseQty).warehouseQty=el.value});
  if(zone==='warehouse')packs=Array.from(root.querySelectorAll('[data-pack-line]')).map(function(row){
   return {itemId:row.querySelector('[data-item]').value,pack:row.querySelector('[data-size]').value,pieces:row.querySelector('[data-pieces]').value};
  });
 }

 function addNumericClearButtons(container){
  if(!container)return;
  container.querySelectorAll('input[data-gross],input[data-service-qty],input[data-warehouse-qty],input[data-pieces]').forEach(function(input){
   if(input.closest('.tbNumberField'))return;
   var wrapper=document.createElement('span');
   wrapper.className='tbNumberField';
   input.parentNode.insertBefore(wrapper,input);
   wrapper.appendChild(input);
   var clear=document.createElement('button');
   clear.type='button';clear.className='tbNumberClear';
   clear.setAttribute('aria-label','Очистить значение');
   clear.setAttribute('title','Очистить значение');
   clear.innerHTML='<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
   wrapper.appendChild(clear);
   function update(){clear.hidden=input.value===''}
   input.addEventListener('input',function(){
    var limit=Number(input.dataset.digits||3);
    var normalized=String(input.value||'').replace(/[^0-9]/g,'').slice(0,limit);
    if(input.value!==normalized)input.value=normalized;
    update();
   });
   input.addEventListener('change',update);
   clear.addEventListener('click',function(e){
    e.preventDefault();e.stopPropagation();
    input.value='';
    input.dispatchEvent(new Event('input',{bubbles:true}));
    input.dispatchEvent(new Event('change',{bubbles:true}));
    input.focus();
   });
   update();
  });
 }


 function scannedGtin(raw){
  var s=String(raw==null?'':raw).replace(/^\]d[12]/,'').replace(/^\]Q3/,'').trim(),values=[];
  function add(v){if(/^\d{14}$/.test(v)&&values.indexOf(v)<0)values.push(v)}
  // Same validated parser as tobacco-inventory v1.0.2: Kazakhstan 14+7+8.
  if(/^\d{14}[\s\S]{15}$/.test(s))add(s.slice(0,14));
  Array.from(s.matchAll(/(?:\(01\)|(?:^|\x1d)01)\s*(\d{14})/g)).forEach(function(m){add(m[1])});
  if(/^01\d{14}/.test(s))add(s.slice(2,16));
  if(/^\d{13}$/.test(s))add('0'+s);
  if(/^\d{14}$/.test(s))add(s);
  return values.find(function(v){var sum=0;for(var i=12;i>=0;i--)sum+=Number(v[i])*((12-i)%2===0?3:1);return (10-sum%10)%10===Number(v[13])})||'';
 }
 var scanRunning=false,scanLocked=false,scanStopping=Promise.resolve(),scanSeq=0;
 function stopScan(){
  var reader=scanReader;
  scanSeq++;
  scanReader=null;scanRunning=false;
  if(!reader)return scanStopping;
  scanStopping=scanStopping.then(function(){return reader.stop().catch(function(){}).then(function(){try{reader.clear()}catch(e){}})}).catch(function(){});
  return scanStopping;
 }
 function closeScan(){
  scanOpen=false;stopScan();
  var overlay=document.querySelector('[data-bc-choice-overlay]');if(overlay)overlay.remove();
  var el=q('[data-scan-panel]');if(el)el.remove();
 }
 function scanStatus(s){var el=q('[data-scan-status]');if(el)el.textContent=s}

 var scanMode='weight';
 function barcodeForm(code,box){
  scanLocked=true;stopScan();box.hidden=false;
  var all=(model.flavors||[]).slice().sort(function(a,b){return (a.brand+' '+a.name).localeCompare(b.brand+' '+b.name,'ru')});
  var serviceSet=new Set((model.lines||[]).filter(function(x){return x.category==='tobacco'}).map(function(x){return String(x.itemId)}));
  var currentFilter='all',selectedFlavor='',selectedPack=200;
  box.innerHTML='<strong>Добавить штрихкод</strong>'+
   '<p class="tbBarcodeCode">GTIN: <b>'+esc(code||'Не считан')+'</b></p>'+
   '<div class="tbSwitch"><button type="button" class="active" data-bc-filter="all">Все вкусы</button><button type="button" data-bc-filter="service">На сервисе</button></div>'+
   '<div class="tbBarcodeField"><span class="tbBarcodeLabel">Вкус</span>'+
   '<button type="button" class="tbFlavorTrigger" data-bc-open aria-expanded="false"><span data-bc-selected>Выберите вкус</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>'+
   '</div>'+
   '<div class="tbBarcodeField"><span class="tbBarcodeLabel">Фасовка</span><div class="tbPackChoices" role="group" aria-label="Фасовка">'+
   [100,125,200,250].map(function(n){return '<button type="button" data-bc-pack="'+n+'" class="'+(n===200?'active':'')+'" aria-pressed="'+(n===200?'true':'false')+'">'+n+' г</button>'}).join('')+'</div></div>'+
   '<div class="tbBarcodeActions"><button type="button" class="tbBarcodeSave" data-bc-save>Сохранить штрихкод</button>'+
   '<button type="button" class="tbBarcodeNext" data-scan-next>Сканировать следующий</button></div>'+
   '<p class="tbError" data-bc-error role="alert" aria-live="polite"></p>';
  var chosen=box.querySelector('[data-bc-selected]'),trigger=box.querySelector('[data-bc-open]');
  function filteredFlavors(){
   return all.filter(function(f){return currentFilter==='all'||serviceSet.has(String(f.id))});
  }
  function openFlavorChoice(){
   var previous=document.querySelector('[data-bc-choice-overlay]');
   if(previous)previous.remove();
   var overlay=document.createElement('div');
   overlay.className='tbChoiceOverlay';
   overlay.setAttribute('data-bc-choice-overlay','');
   var dialog=document.createElement('div');
   dialog.className='tbChoiceDialog';
   dialog.setAttribute('role','dialog');
   dialog.setAttribute('aria-modal','true');
   dialog.setAttribute('aria-label','Выбор вкуса');
   overlay.appendChild(dialog);
   document.body.appendChild(overlay);
   function closeChoice(){
    overlay.remove();
    trigger.setAttribute('aria-expanded','false');
   }
   overlay.addEventListener('click',function(e){if(e.target===overlay)closeChoice()});
   function heading(title,back){
    var top=document.createElement('div');top.className='tbChoiceHead';
    if(back){
     var backButton=document.createElement('button');
     backButton.type='button';backButton.className='tbChoiceBack';backButton.textContent='← Назад';
     backButton.onclick=showBrands;top.appendChild(backButton);
    }
    var caption=document.createElement('h3');caption.textContent=title;top.appendChild(caption);
    var exit=document.createElement('button');exit.type='button';exit.className='tbChoiceClose';
    exit.setAttribute('aria-label','Закрыть');exit.textContent='×';exit.onclick=closeChoice;
    top.appendChild(exit);dialog.replaceChildren(top);
   }
   function makeGrid(items,onPick){
    var grid=document.createElement('div');grid.className='tbChoiceGrid';
    if(!items.length){var empty=document.createElement('p');empty.className='tbChoiceEmpty';empty.textContent='Нет доступных позиций';grid.appendChild(empty)}
    items.forEach(function(item){
     var btn=document.createElement('button');btn.type='button';btn.className='tbChoiceButton';
     btn.textContent=item.label;
     if(item.selected)btn.classList.add('selected');
     btn.onclick=function(){onPick(item)};grid.appendChild(btn);
    });
    dialog.appendChild(grid);
   }
   function showBrands(){
    heading('Выбор бренда',false);
    var brands=[...new Set(filteredFlavors().map(function(f){return String(f.brand||'')}))].sort(function(a,b){
     return brandLabel(a).localeCompare(brandLabel(b),'ru');
    });
    makeGrid(brands.map(function(brand){return {id:brand,label:brandLabel(brand)}}),function(item){showFlavors(item.id)});
   }
   function showFlavors(brand){
    heading(brandLabel(brand)+' · Вкус',true);
    var flavors=filteredFlavors().filter(function(f){return String(f.brand||'')===brand})
      .sort(function(a,b){return String(a.name).localeCompare(String(b.name),'ru')});
    makeGrid(flavors.map(function(f){return {id:String(f.id),label:String(f.name),selected:String(f.id)===selectedFlavor}}),function(item){
     selectedFlavor=item.id;
     var flavor=all.find(function(f){return String(f.id)===selectedFlavor});
     chosen.textContent=flavor?brandLabel(flavor.brand)+' · '+flavor.name:'Выберите вкус';
     chosen.classList.toggle('is-selected',!!flavor);
     box.querySelector('[data-bc-error]').textContent='';
     closeChoice();
    });
   }
   showBrands();
   trigger.setAttribute('aria-expanded','true');
  }
  trigger.onclick=openFlavorChoice;
  box.querySelectorAll('[data-bc-filter]').forEach(function(btn){btn.onclick=function(){
   currentFilter=btn.dataset.bcFilter;
   box.querySelectorAll('[data-bc-filter]').forEach(function(b){b.classList.toggle('active',b===btn)});
   if(selectedFlavor&&!filteredFlavors().some(function(f){return String(f.id)===selectedFlavor})){
    selectedFlavor='';chosen.textContent='Выберите вкус';chosen.classList.remove('is-selected');
   }
  }});
  box.querySelectorAll('[data-bc-pack]').forEach(function(btn){btn.onclick=function(){
   selectedPack=Number(btn.dataset.bcPack);
   box.querySelectorAll('[data-bc-pack]').forEach(function(b){

   });

 function scanFound(raw){

  var code=scannedGtin(raw),box=q('[data-scan-result]');
  if(!box)return;

  if(scanMode==='add'){barcodeForm(code,box);return}
  scanLocked=true;stopScan();box.hidden=false;
  var entries=(model.barcodes||[]).filter(function(x){return scannedGtin(x.barcode)===code});
  var unique=[...new Set(entries.map(function(x){return String(x.itemId)}))];

  if(!entries.length){
   box.innerHTML='<strong>GTIN '+esc(code)+'</strong><p>Штрихкод не найден в разделе «Списки → Штрихкоды».</p>';

  }else if(!item){

   var old=draft.get(item.itemId).serviceGross;

 function loadScanDecoder(){
  if(window.Html5Qrcode)return Promise.resolve();
  var urls=['https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js','https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js'];
  function load(i){
   if(i>=urls.length)return Promise.reject(Error('Декодер не загрузился'));
   return new Promise(function(ok,fail){var s=document.createElement('script');s.src=urls[i];s.onload=ok;s.onerror=fail;document.head.appendChild(s)})
    .then(function(){if(!window.Html5Qrcode)throw Error('Декодер недоступен')}).catch(function(){return load(i+1)});
  }
  return load(0);
 }
 async function startScanCamera(){
  if(!scanOpen)return;
  var seq=++scanSeq;
  await stopScan(); // camera must be released before starting another read
  if(!scanOpen)return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){scanStatus('Камера недоступна. Введите GTIN вручную.');return}
  scanLocked=false;scanStatus('Включаем заднюю камеру…');
  var decoder;
  try{
   await loadScanDecoder();
   if(!scanOpen||seq+1!==scanSeq)return;
   var supported=[Html5QrcodeSupportedFormats.DATA_MATRIX,Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.UPC_A];
   decoder=new Html5Qrcode('tb-inline-reader',{formatsToSupport:supported,verbose:false,experimentalFeatures:{useBarCodeDetectorIfSupported:false}});
   scanReader=decoder;
   var width=Math.min(Math.max(window.innerWidth-50,220),440),side=Math.min(280,Math.max(170,width-45));
   await decoder.start({facingMode:'environment'},{
    fps:15,qrbox:{width:side,height:side},aspectRatio:1,
    videoConstraints:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}}
   },function(decoded){if(scanOpen&&scanReader===decoder)scanFound(decoded)},function(){});
   if(!scanOpen||scanReader!==decoder){try{await decoder.stop()}catch(e){};try{decoder.clear()}catch(e){};return}
   scanRunning=true;
   var video=q('#tb-inline-reader video');
   if(video){video.setAttribute('playsinline','');video.setAttribute('webkit-playsinline','');video.muted=true;video.controls=false}
   scanStatus('Наведите камеру на Data Matrix или штрихкод');
  }catch(e){
   scanStatus('Не удалось открыть камеру: '+String(e&&e.message||e)+'. Можно ввести GTIN вручную.');
   if(decoder){try{await decoder.stop()}catch(_){}try{decoder.clear()}catch(_){}}
   if(scanReader===decoder)scanReader=null;
  }
 }

 function crTbToday(){

  var parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Almaty',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
  var values={};parts.forEach(function(x){values[x.type]=x.value});
  return values.year+'-'+values.month+'-'+values.day;
 }

   var v=String(el.value||'');
   if(!v)return false;
   var max=Number(el.dataset.digits||3);
   var regex=/^[0-9]+$/;
   var whole=v.split('.')[0];
   return !regex.test(v)||whole.length>max||(el.hasAttribute('data-pieces')&&Number(v)<1);
  });
  if(invalid){message('Проверьте количество цифр в поле');invalid.focus();return}
  var lines=buildLinesForSave();
  busy=true;q('[data-save]').disabled=true;message('');
  var rev=model.revision;
  api.call('crStaffTobaccoSave',{id:model.id,zone:zone,revision:rev,lines:lines},function(r){
   busy=false;refresh();
  },function(err){busy=false;var b=q('[data-save]');if(b)b.disabled=false;message(err)});
 }
 function refresh(){
  if(!root||busy)return;
  var current=++epoch;
  root.innerHTML='<p class="tbHint">Загружаем инвентаризацию…</p>';
  api.call('crStaffTobaccoActive',{},function(r){
   if(current!==epoch||!api.isActive())return;
   model=r;draft=new Map();packs=[];
   (r.lines||[]).forEach(function(i){
    draft.set(i.itemId,{serviceGross:i.serviceGross??'',serviceTare:i.serviceTare??'',serviceQty:i.serviceQty??'',warehouseQty:i.warehouseQty??''});
    (i.warehousePacks||[]).forEach(function(p){packs.push({itemId:i.itemId,pack:p.pack,pieces:p.pieces})});
   });
   render();
  },function(err){if(current===epoch&&root)root.innerHTML='<p class="tbError">'+esc(err)+'</p><button class="tbBtn" data-refresh>Повторить</button>';if(q('[data-refresh]'))q('[data-refresh]').onclick=refresh});
 }
 return {mount:function(node){root=node;opened=false;refresh()},refresh:refresh,openBarcode:function(){scanMode='add';openScan()},closeBarcode:function(){closeScan()},clear:function(){closeScan();epoch++;root=null;model=null;draft=null;packs=[];opened=false}};
};
</script>
